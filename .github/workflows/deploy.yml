name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          github_token: ${{ github.token }}
      - run: npm run check:web
        env:
          SITE_URL: https://awesomecodevideo.com
          SITE_INDEXING: 'true'
          SITE_BASE: /
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Wait for certificate and enforce HTTPS
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..90}; do
            if gh api --method PUT repos/${{ github.repository }}/pages -F https_enforced=true; then
              curl --fail --silent --show-error --retry 5 --retry-delay 10 https://awesomecodevideo.com/ -o /dev/null
              exit 0
            fi
            echo "Certificate not ready yet (attempt ${attempt}/90). Retrying in 30 seconds."
            sleep 30
          done
          echo "GitHub Pages certificate is still pending. Re-run the deployment after certificate issuance."
          exit 1
